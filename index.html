<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Escuela de Crecimiento | Diócesis de Vitoria</title>
  <meta name="description" content="Un itinerario de maduración en la fe, en comunidad, para vivirlo.">
  <style>
    *{box-sizing:border-box}html,body{margin:0;background:#fff;font-family:Arial,sans-serif}
    .landing{position:relative;width:min(100%,1366px);margin:0 auto;line-height:0}
    .landing>img{display:block;width:100%;height:auto}
    .hotspot{position:absolute;z-index:2;display:block;border-radius:12px;line-height:1;text-indent:-9999px;overflow:hidden}
    .hotspot:focus-visible{outline:5px solid #ff751f;outline-offset:4px;background:#fff3}
    .more{left:64.4%;top:4%;width:21.2%;height:1.05%}
    .chat{left:42.2%;top:33.1%;width:37%;height:1.8%}
    .video{left:44.5%;top:55.2%;width:44.5%;height:6.1%}
    .interest{left:55.5%;top:76.3%;width:31%;height:8.6%}
    .join{left:32.4%;top:95%;width:22%;height:1.2%}
    .legal{padding:18px 20px 26px;text-align:center;line-height:1.4;color:#5d6468;font-size:14px}
    .legal button{border:0;background:none;color:#642f3b;text-decoration:underline;cursor:pointer;font:inherit}
    dialog{border:0;border-radius:18px;padding:0;width:min(94vw,960px);box-shadow:0 25px 80px #0005}
    dialog::backdrop{background:#0009}.privacy-head{display:flex;justify-content:flex-end;padding:10px;background:#fff;line-height:1}
    .privacy-head button{width:42px;height:42px;border:0;border-radius:50%;font-size:25px;cursor:pointer;background:#f1ece9}
    dialog img{display:block;width:100%;height:auto}
    @media(max-width:600px){.hotspot{border-radius:5px}.legal{font-size:12px;padding:14px}}
  </style>
</head>
<body>
  <main class="landing" aria-label="Landing de la Escuela de Crecimiento">
    <img src="Home.png" alt="Escuela de Crecimiento. Crece junto a otros desde dentro. Itinerario parroquial de maduración en la fe para el curso 2026-2027.">
    <a class="hotspot more" href="https://forms.gle/Am4f74XQNTKPjmDe6" target="_blank" rel="noopener">Saber más</a>
    <a class="hotspot chat" href="#chatbase" data-open-chat>Haz tus primeras preguntas</a>
    <a class="hotspot video" href="https://youtu.be/wTGdiwtE38M" target="_blank" rel="noopener">Ver vídeo</a>
    <a class="hotspot interest" href="https://forms.gle/rZm5XJDNXA3vtCuz9" target="_blank" rel="noopener">Solicitar información</a>
    <a class="hotspot join" href="https://forms.gle/T1RHZSjUBQiVi7s8A" target="_blank" rel="noopener">Apúntate como amigo</a>
  </main>
  <div class="legal">Escuela de Crecimiento · Diócesis de Vitoria · <button type="button" data-open-privacy>Política de privacidad</button></div>
  <dialog id="privacy"><div class="privacy-head"><button type="button" aria-label="Cerrar" data-close-privacy>×</button></div><img src="Privacidad.png" alt="Política de privacidad de la Escuela de Crecimiento"></dialog>
  <script>
    document.querySelector('[data-open-privacy]').addEventListener('click',()=>document.getElementById('privacy').showModal());
    document.querySelector('[data-close-privacy]').addEventListener('click',()=>document.getElementById('privacy').close());
    document.querySelector('[data-open-chat]').addEventListener('click',e=>{e.preventDefault();window.chatbase('open')});
  </script>
  <script>
  (function(){if(!window.chatbase||window.chatbase("getState")!=="initialized"){window.chatbase=(...arguments)=>{if(!window.chatbase.q){window.chatbase.q=[]}window.chatbase.q.push(arguments)};window.chatbase=new Proxy(window.chatbase,{get(target,prop){if(prop==="q"){return target.q}return(...args)=>target(prop,...args)}})}const onLoad=function(){const script=document.createElement("script");script.src="https://www.chatbase.co/embed.min.js";script.id="Z96MRzPkE8ugIpUFC3aZi";script.domain="www.chatbase.co";document.body.appendChild(script)};if(document.readyState==="complete"){onLoad()}else{window.addEventListener("load",onLoad)}})();
  </script>
</body>
</html>
